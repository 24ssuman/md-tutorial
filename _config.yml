title: Molecular Dynamics Tutorial
author: Suman Saha
copyright: "2026, Suman Saha (MIT License)"
description: A beginner-friendly, interactive, concept-first introduction to Molecular Dynamics and enhanced sampling.

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/24ssuman/md-tutorial
  branch: main

html:
  use_issues_button: true
  use_repository_button: true

sphinx:
  extra_extensions:
    - sphinx.ext.mathjax
  config:
    html_css_files:
      - custom.css

exclude_patterns:
  - plan.md
  - README.md
  - requirements.txt
  - requirements-book.txt
  - pyproject.toml
  - LICENSE
  - .antigravitycli
  - .github
  - md_tutorial.egg-info
