[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md-tutorial"
version = "1.0.0"
description = "Beginner-friendly Molecular Dynamics tutorial with Jupyter notebooks"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "ipywidgets",
]

[project.optional-dependencies]
full = ["ase"]

[tool.setuptools]
packages = ["md_tutorial"]
